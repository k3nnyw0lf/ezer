name: Bug report
description: Something in the client, mock carrier, conformance suite, or spec is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Never paste credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: node 20.11 / Windows 11
